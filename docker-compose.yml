version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: actra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-actra}
      POSTGRES_USER: ${POSTGRES_USER:-actra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
